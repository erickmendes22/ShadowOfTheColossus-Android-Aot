name: SotC local signing utility (no keys)
on:
  push:
    branches: [fix/sotc-020-native-ngs2-audio]
    paths: ['.github/workflows/sotc-local-apksigner.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signer:
    runs-on: ubuntu-24.04
    steps:
      # Hosted Ubuntu runners already provide command-line Android SDK tools.
      # Avoid setup-android's deprecated attempt to install the removed 'tools' package.
      - name: Install Android build-tools 35 apksigner library
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          found=$(find "$sdk" -path '*/build-tools/*/lib/apksigner.jar' -type f -print -quit 2>/dev/null || true)
          if [[ -z "$found" ]]; then
            manager=$(find "$sdk" -name sdkmanager -type f -print -quit 2>/dev/null || true)
            test -n "$manager"
            "$manager" 'build-tools;35.0.0'
            found=$(find "$sdk" -path '*/build-tools/*/lib/apksigner.jar' -type f -print -quit)
          fi
          test -s "$found"
          cp "$found" /tmp/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: SotC-Android-apksigner-35-JAR-only-NO-KEYS
          path: /tmp/apksigner.jar
          retention-days: 7
